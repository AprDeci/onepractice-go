name: onepractice

services:
  api:
    image: ${API_IMAGE:?API_IMAGE is required}
    container_name: onepractice-api
    restart: unless-stopped
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      SERVER_PORT: "8080"
      MYSQL_DSN: ${MYSQL_DSN:?MYSQL_DSN is required}
      REDIS_ADDR: ${REDIS_ADDR:-}
      REDIS_USERNAME: ${REDIS_USERNAME:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_DISABLED: ${REDIS_DISABLED:-false}
      SA_TOKEN_NAME: ${SA_TOKEN_NAME:-token}
      SA_TOKEN_TIMEOUT: ${SA_TOKEN_TIMEOUT:-1296000}
      SENDFLARE_DISABLED: ${SENDFLARE_DISABLED:-true}
      SENDFLARE_API_KEY: ${SENDFLARE_API_KEY:-}
      SENDFLARE_FROM: ${SENDFLARE_FROM:-}
      TZ: Asia/Shanghai

networks:
  default:
    name: ${DOCKER_NETWORK:-1panel-network}
    external: true
