info:
  contact: {}
  description: Onepractice 在线英语真题平台 Go 后端 API。
  title: Onepractice API
  version: 0.1.0
paths:
  /api/captcha/email:
    get:
      description: 向指定邮箱发送验证码。
      parameters:
      - description: 邮箱
        in: query
        name: email
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      summary: 发送邮箱验证码
      tags:
      - captcha
  /api/captcha/email/verify:
    post:
      consumes:
      - application/json
      description: 校验邮箱验证码，成功后返回重置密码凭证。
      parameters:
      - description: 邮箱验证码参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.EmailCaptchaRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.ResetPasswordTokenResponse'
              type: object
      summary: 校验邮箱验证码
      tags:
      - captcha
  /api/dictionary/books:
    get:
