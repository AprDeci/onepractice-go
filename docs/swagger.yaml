      description: 按关键词、拼写、释义、词书和词频范围分页查询单词。
      parameters:
      - description: 关键词
        in: query
        name: keyword
        type: string
      - description: 拼写
        in: query
        name: spelling
        type: string
      - description: 释义
        in: query
        name: paraphrase
        type: string
      - description: 词书 ID
        in: query
        name: bookId
        type: integer
      - description: 最小词频
        in: query
        name: minFrequency
        type: number
      - description: 最大词频
        in: query
        name: maxFrequency
        type: number
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页大小
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/apiv1.DictionaryWordPage'
              type: object
      summary: 分页查询单词
      tags:
      - dictionary
  /api/v1/dictionary/words/{wordId}:
    get:
      description: 根据单词 ID 获取单词基础信息、所属词书和例句。
      parameters:
      - description: 单词 ID
        in: path
        name: wordId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/apiv1.DictionaryWordDetail'
              type: object
      summary: 获取单词详情
      tags:
      - dictionary
  /api/v1/dictionary/words/by-spelling/{spelling}:
    get:
      description: 根据英文拼写精确获取单词基础信息、所属词书和例句。
      parameters:
      - description: 拼写
        in: path
        name: spelling
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/apiv1.DictionaryWordDetail'
              type: object
      summary: 按拼写获取单词详情
      tags:
      - dictionary
  /api/v1/essay/records/{recordId}/results:
    get:
      description: 按 recordId 查询当前登录用户某次考试关联的作文评分结果列表。
      parameters:
      - description: 答题记录 ID
        in: path
        name: recordId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/dto.EssayResultResponse'
                  type: array
              type: object
      security:
      - ApiKeyAuth: []
      summary: 查询考试的作文评分结果
      tags:
      - essay
  /api/v1/essay/results:
    get:
      description: 分页查询当前登录用户不关联考试记录的独立作文评分结果。
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页大小
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/apiv1.EssayResultPage'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 查询独立作文评分历史
      tags:
      - essay
  /api/v1/essay/results/{taskId}:
    get:
      description: 按 taskId 从数据库查询当前登录用户的作文评分结果。
      parameters:
      - description: 任务 ID
        in: path
        name: taskId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.EssayResultResponse'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 查询作文评分结果
      tags:
      - essay
  /api/v1/essay/tasks:
    post:
      consumes:
      - application/json
      description: 提交作文题目与正文，创建异步批改任务，返回 taskId 与初始状态。
      parameters:
      - description: 作文批改任务参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.CreateEssayTaskRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/apiv1.EssayTaskCreatedResponse'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 创建作文批改任务
      tags:
      - essay
  /api/v1/essay/tasks/{taskId}:
    get:
      description: 按 taskId 查询当前登录用户的作文批改任务状态与结果。
      parameters:
      - description: 任务 ID
        in: path
        name: taskId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.EssayTask'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 查询作文批改任务
      tags:
      - essay
  /api/v1/ocr:
    post:
      consumes:
      - multipart/form-data
      description: 上传图片并调用 GLM OCR，返回识别出的文字与版面信息。
      parameters:
      - description: 图片文件，支持 jpg/jpeg/png/webp，单张不超过 10MB
        in: formData
        name: image
        required: true
        type: file
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/apiv1.OcrResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/response.Body'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - ApiKeyAuth: []
      summary: 图片 OCR 识别
      tags:
      - agent
  /api/v1/paper-types:
    get:
      description: 返回全部可用的试卷类型。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  items:
                    type: string
                  type: array
              type: object
      summary: 获取试卷类型列表
      tags:
      - paper
  /api/v1/papers:
    get:
      description: 分页查询试卷；默认 items 为 Paper。传 include=rating 时 items 为 PaperWithRating（含评分与题量）。
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页大小
        in: query
        name: pageSize
        type: integer
      - description: 试卷类型
        in: query
        name: type
        type: string
      - description: 年份
        in: query
        name: year
        type: integer
      - description: 传 rating 返回评分信息
        in: query
        name: include
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/apiv1.PaperPage'
              type: object
      summary: 获取试卷列表
      tags:
      - paper
  /api/v1/papers/{paperId}/answers:
    get:
      description: 返回指定试卷的全部答案，并按答案序号排序。
      parameters:
      - description: 试卷 ID
        in: path
        name: paperId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/apiv1.AnswersResponse'
              type: object
      summary: 获取试卷答案
      tags:
      - question
  /api/v1/papers/{paperId}/intro:
    get:
      description: 返回指定试卷的题型、时长、难度与各部分题量。
      parameters:
      - description: 试卷 ID
        in: path
        name: paperId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/apiv1.PaperIntro'
              type: object
      summary: 获取试卷简介
      tags:
      - paper
  /api/v1/papers/{paperId}/questions:
    get:
      description: 返回指定试卷下的全部题目；默认 data 为题目数组，传 groupBy=part 时 data 为 ExamQuestion
        分组结构。
      parameters:
      - description: 试卷 ID
        in: path
        name: paperId
        required: true
        type: integer
      - description: 题型
        in: query
        name: type
        type: string
      - description: 传 part 按 Part 分组
        in: query
        name: groupBy
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/model.Question'
                  type: array
              type: object
      summary: 按试卷获取题目
      tags:
      - question
  /api/v1/points/balance:
    get:
      description: 返回当前登录用户的积分余额。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/apiv1.PointsBalanceResponse'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 查询积分余额
      tags:
      - points
  /api/v1/points/checkin-status:
    get:
      description: 返回当前登录用户今日是否已签到。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/apiv1.CheckinStatusResponse'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 查询签到状态
      tags:
      - points
  /api/v1/points/daily-checkin:
    post:
      description: 领取当日签到积分，同日重复领取幂等返回 granted=false。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/apiv1.PointsGrantResponse'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 每日签到
      tags:
      - points
  /api/v1/points/transactions:
    get:
      description: 分页返回当前登录用户的积分流水，按时间倒序。
      parameters:
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页大小
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/apiv1.PointsTransactionPage'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 查询积分流水
      tags:
      - points
  /api/v1/questions/practice:
    post:
      consumes:
      - application/json
      description: 无需登录，返回随机试卷中的指定题型、题组和答案。
      parameters:
      - description: 专项训练参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apiv1.PracticeQuestionRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/apiv1.PracticeQuestionResponse'
              type: object
      summary: 获取专项训练题目
      tags:
      - question
  /api/v1/records:
    get:
      description: 按最近天数分页获取当前登录用户的答题记录。
      parameters:
      - description: 最近天数
        in: query
        name: days
        type: integer
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页大小
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/apiv1.RecordPage'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 获取答题记录列表
      tags:
      - record
    post:
      consumes:
      - application/json
      description: 为当前登录用户创建一条答题记录，返回 recordId。
      parameters:
      - description: 答题记录参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apiv1.CreateRecordRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/apiv1.RecordCreatedResponse'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 保存答题记录
      tags:
      - record
  /api/v1/records/{recordId}:
    put:
      consumes:
      - application/json
      description: 更新当前登录用户已有答题记录的作答结果。
      parameters:
      - description: 记录 ID
        in: path
        name: recordId
        required: true
        type: string
      - description: 答题记录参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apiv1.UpdateRecordRequest'
      responses:
        "204":
          description: No Content
      security:
      - ApiKeyAuth: []
      summary: 更新答题记录
      tags:
      - record
  /api/v1/users/me:
    get:
      description: 根据 token 获取当前登录用户信息。
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/apiv1.UserInfoResponse'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 获取当前用户信息
      tags:
      - user
  /api/v1/users/me/favorite-words:
    get:
      description: 分页获取当前用户收藏的单词，并返回词库释义、音标等信息。
      parameters:
      - description: 关键词
        in: query
        name: keyword
        type: string
      - description: 页码
        in: query
        name: page
        type: integer
      - description: 每页大小
        in: query
        name: pageSize
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/apiv1.FavoriteWordPage'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 分页获取收藏单词
      tags:
      - word_favorite
    post:
      consumes:
      - application/json
      description: 收藏词库中的单词。
      parameters:
      - description: 收藏参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/apiv1.FavoriteWordRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.WordFavoriteRequest'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 收藏单词
      tags:
      - word_favorite
  /api/v1/users/me/favorite-words/{wordId}:
    delete:
      description: 取消收藏词库中的单词。
      parameters:
      - description: 单词 ID
        in: path
        name: wordId
        required: true
        type: integer
      responses:
        "204":
          description: No Content
      security:
      - ApiKeyAuth: []
      summary: 取消收藏单词
      tags:
      - word_favorite
    get:
      description: 检查当前用户是否已收藏指定单词。
      parameters:
      - description: 单词 ID
        in: path
        name: wordId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/apiv1.FavoriteStatusResponse'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 检查单词是否已收藏
      tags:
      - word_favorite
  /api/word/favorites:
    delete:
      description: 取消收藏词库中的单词。支持 wordid 或 word 查询参数；不存在也返回成功。
      parameters:
      - description: 单词 ID
        in: query
        name: wordid
        type: integer
      - description: 英文拼写
        in: query
        name: word
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - ApiKeyAuth: []
      summary: 取消收藏单词
      tags:
      - word
    get:
      description: 分页获取当前用户收藏的单词，并返回词库释义、音标等信息。
      parameters:
      - description: 在单词拼写和释义中搜索
        in: query
        name: keyword
        type: string
      - description: 页码，默认 1
        in: query
        name: page
        type: integer
      - description: 每页数量，默认 20，最大 100
        in: query
        name: page_size
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.CollectedWordList'
              type: object
      security:
      - ApiKeyAuth: []
      summary: 分页获取收藏单词
      tags:
      - word
    post:
      consumes:
      - application/json
      description: 收藏词库中的单词。优先使用 wordid；未传 wordid 时按 word 精确匹配 tb_vocabulary.spelling。
      parameters:
      - description: 收藏参数
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/dto.WordFavoriteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/response.Body'
      security:
      - ApiKeyAuth: []
      summary: 收藏单词
      tags:
      - word
  /api/word/favorites/check:
    get:
      description: 检查当前用户是否已收藏指定单词。支持 wordid 或 word 查询参数。
      parameters:
      - description: 单词 ID
        in: query
        name: wordid
        type: integer
      - description: 英文拼写
        in: query
        name: word
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  type: boolean
              type: object
      security:
      - ApiKeyAuth: []
      summary: 检查单词是否已收藏
      tags:
      - word
  /health:
    get:
      description: 返回服务状态和数据库是否启用。
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/response.Body'
            - properties:
                data:
                  $ref: '#/definitions/dto.HealthResponse'
              type: object
      summary: 健康检查
      tags:
      - health
securityDefinitions:
  ApiKeyAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
